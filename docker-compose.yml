# NUNDO — Docker Compose
# Usage: docker compose up -d
# Frontend: http://localhost:3000  |  API (direct): http://localhost:4000
#
# Surcharger en production via un fichier .env :
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / JWT_SECRET

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nundo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nundo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nundo}
    volumes:
      - nundo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nundo}:${POSTGRES_PASSWORD:-nundo_secret}@db:5432/${POSTGRES_DB:-nundo}
      # À surcharger impérativement en production.
      JWT_SECRET: ${JWT_SECRET:-nundo-docker-secret-change-me}
    depends_on:
      db: { condition: service_healthy }
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(h=>process.exit(h.status==='ok'?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # same origin → nginx proxies /api to server
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nundo_pgdata:
